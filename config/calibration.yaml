# Control sample for gate calibration (positive control).
#
# These are niches known in advance to be live self-serve businesses:
# the product is bought by card on a subscription of about $9–49/mo, the buyer arrives on their own via search,
# not through a sales department, and the niche has several independent paid players.
#
# These are not hypotheses to verify. This is the reference for the instrument: a pipeline that rejects
# most lines of this file says nothing about the market — it says something about its own thresholds.
# A zero at a run's output is meaningful only after the control passes.
#
# The phrases imitate what the expand stage produces: the head phrase, questions, modifiers
# (api, software, tool, free), tool shapes, and commercial tails (alternatives, pricing).
# Invoked by: python3 -B scripts/calibrate.py --run calib-<date>
#
# The file describes two samples. `niches` — the positive control, it must pass entirely.
# `negative` — what must be screened out, and each line targets its own rule: a gate
# that lets everything through is not an instrument but a sieve. Calibration counts both sides: how many live niches
# passed and how many dead ones failed.
schema_version: '1.0'

