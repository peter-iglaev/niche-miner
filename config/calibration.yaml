# Контрольная выборка для калибровки гейтов (положительный контроль).
#
# Здесь собраны ниши, про которые заранее известно, что это живой self-serve бизнес:
# продукт покупают картой по подписке порядка $9–49/мес, покупатель приходит сам через поиск,
# а не через отдел продаж, и у ниши есть несколько независимых платных игроков.
#
# Это не гипотезы для проверки. Это эталон для прибора: пайплайн, который отвергает
# большинство строк этого файла, ничего не говорит про рынок — он говорит про свои пороги.
# Ноль на выходе прогона доказателен только после того, как контроль проходит.
#
# Фразы имитируют то, что порождает стадия разворота: головная фраза, вопросы, модификаторы
# (api, software, tool, free), формы инструмента и коммерческие хвосты (alternatives, pricing).
# Запускается: python3 -B scripts/calibrate.py --run calib-<дата>
#
# Файл описывает две выборки. `niches` — положительный контроль, он должен проходить целиком.
# `negative` — то, что обязано отсеиваться, и каждая строка целится в своё правило: гейт,
# пропускающий всё, не прибор, а решето. Калибровка считает обе стороны: сколько живых ниш
# прошло и сколько мёртвых не прошло.
